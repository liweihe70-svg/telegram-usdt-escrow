<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escrow · 正式后台开发版</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><a href="/" class="brand">e.<span>escrow <small id="subtitle">正式后台开发版</small></span></a><div><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select><span id="identity"></span><button id="shutdown" hidden>停止后台</button><button id="logout" hidden>退出登录</button></div></header>
<main><div id="notice" class="notice">本地开发环境 · 实际收款与广播未启用</div><section id="auth" class="auth-card" hidden><span class="eyebrow">ESCROW WORKSPACE</span><h1 id="auth-title"></h1><p id="auth-description"></p><form id="auth-form"><label id="username-label">管理员账号<input name="username" autocomplete="username" required pattern="[a-zA-Z0-9_]{3,32}" maxlength="32"></label><label id="password-label">密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><label id="repeat-label" hidden>重复密码<input name="repeat" type="password" autocomplete="new-password" maxlength="256"></label><button type="submit" class="primary" id="auth-submit">登录</button></form><p id="auth-error" role="alert"></p></section>
<section id="workspace" hidden><nav id="nav"><button data-page="overview">概览</button><button data-page="orders">正式订单</button><button data-page="approvals">出款审核</button><button data-page="cases">退款与争议</button><button data-page="settings">网络配置</button><button data-page="audit">操作记录</button><button data-page="guide">管理员指南</button></nav><div class="heading"><div><span class="eyebrow">BEP20 · BNB CHAIN</span><h1 id="page-title"></h1></div><button id="refresh">刷新</button></div><div id="content"></div></section>
</main><dialog id="modal"><div class="dialog-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close">×</button></div><div id="modal-content"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
