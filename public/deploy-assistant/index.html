<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TESTUSD · 测试部署助手</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><a class="brand" href="/">e.<span>escrow <small id="subtitle">测试部署助手</small></span></a><select id="signer-network" aria-label="Network"><option value="testnet">BNB 测试网 97</option><option value="mainnet">BNB 主网 56 · 真实资金</option></select><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></header>
<main><div class="notice" id="mainnet-banner" hidden></div><div class="notice" id="notice"></div><h1 id="title"></h1><p id="intro"></p>
<section class="panel"><h2 id="wallet-title"></h2><p id="wallet-help"></p><div class="toolbar"><select id="wallets" aria-label="Wallet"></select><button id="connect" class="primary"></button><button id="refresh"></button></div><div class="details"><div><span id="account-label"></span><b id="account" class="mono">—</b></div><div><span id="network-label"></span><b id="network">—</b></div><div><span id="balance-label"></span><b id="balance">—</b></div></div></section>
<section class="panel"><h2 id="token-title"></h2><div class="cards"><div class="card"><span id="symbol-label"></span><b>TESTUSD</b></div><div class="card"><span id="decimals-label"></span><b>18</b></div><div class="card"><span id="supply-label"></span><b>1,000,000</b></div><div class="card"><span id="chain-label"></span><b>97</b></div></div><p id="estimate-help"></p><button id="estimate"></button><p id="estimate-result"></p><form id="deploy-form"><label id="confirmation-label"><span id="confirmation-text"></span><input id="confirmation" autocomplete="off" required pattern="TESTNET"></label><button id="deploy" class="primary" disabled></button></form></section>
<section class="panel"><h2 id="result-title"></h2><p id="status" role="status" aria-live="polite"></p><div class="details"><div><span id="hash-label"></span><b id="hash" class="mono">—</b></div><div><span id="contract-label"></span><input id="contract" readonly aria-label="Contract address" value=""></div></div><div class="actions"><button id="copy" disabled></button><button id="import" disabled></button></div><form id="recover-form"><label><span id="recover-label"></span><input id="recover-hash" autocomplete="off" required pattern="0x[0-9a-fA-F]{64}"></label><button id="recover"></button></form><p id="recover-help"></p><a id="explorer" target="_blank" rel="noopener noreferrer" hidden></a></section>
<section class="panel" id="platform-panel"><h2 id="platform-title"></h2><p id="platform-help"></p><p id="platform-status" role="status" aria-live="polite"></p>
<form id="platform-create-form"><div class="grid"><label><span id="platform-password-label"></span><input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><label><span id="platform-repeat-label"></span><input name="repeat" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label></div><button id="platform-create" class="primary"></button></form>
<div id="platform-output" hidden><div class="details"><div><span id="platform-xpub-label"></span><textarea id="platform-xpub" readonly rows="3" aria-label="Platform public xpub"></textarea></div><div><span id="platform-root-label"></span><b id="platform-root" class="mono"></b></div><div><span id="platform-address-label"></span><b id="platform-address" class="mono"></b></div></div><div class="actions"><a id="platform-download" download="escrow-testnet-wallet.json"></a><button id="platform-copy" disabled></button><button id="platform-replace" type="button" class="danger"></button></div></div>
<h2 id="platform-restore-title"></h2><p id="platform-restore-help"></p><form id="platform-restore-form"><label><span id="platform-file-label"></span><input id="platform-file" type="file" accept=".json,application/json" required></label><label><span id="platform-restore-password-label"></span><input name="password" type="password" autocomplete="off" required maxlength="128"></label><button id="platform-restore" class="primary"></button></form>
</section>
<section class="panel" id="payout-panel"><h2 id="payout-title"></h2><p id="payout-help"></p><a href="http://127.0.0.1:8782/" target="_blank" rel="noopener noreferrer" id="payout-login"></a><div class="actions"><button id="payout-connect" class="primary"></button><button id="payout-refresh" disabled></button></div><p id="payout-status" role="status" aria-live="polite"></p>
<label><span id="payout-select-label"></span><select id="payout-select"></select></label><pre id="payout-details"></pre><button id="payout-prepare" disabled></button>
<div id="gas-box"><h3 id="gas-title"></h3><p id="gas-help"></p><pre id="gas-details"></pre><button id="gas-prepare" disabled></button>
<form id="gas-sign-form"><label><span id="gas-password-label"></span><input name="password" type="password" autocomplete="off" required maxlength="128"></label><label><span id="gas-sign-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="gas-sign" class="primary" disabled></button></form>
<form id="gas-broadcast-form"><label><span id="gas-broadcast-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="gas-broadcast" class="primary" disabled></button></form></div>
<form id="payout-sign-form"><label><span id="payout-file-label"></span><input id="payout-file" type="file" accept=".json,application/json" required></label><label><span id="payout-password-label"></span><input name="password" type="password" autocomplete="off" required maxlength="128"></label><label><span id="payout-sign-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="payout-sign" class="primary" disabled></button></form>
<form id="payout-broadcast-form"><label><span id="payout-broadcast-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="payout-broadcast" class="primary" disabled></button></form><p id="payout-hash" class="mono"></p>
<div id="replace-box"><h3 id="replace-title"></h3><p id="replace-help"></p><pre id="replace-details"></pre><button id="replace-prepare" disabled></button>
<form id="replace-sign-form"><label><span id="replace-password-label"></span><input name="password" type="password" autocomplete="off" required maxlength="128"></label><label><span id="replace-sign-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="replace-sign" class="primary" disabled></button></form>
<form id="replace-broadcast-form"><label><span id="replace-broadcast-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="replace-broadcast" class="primary" disabled></button></form></div>
</section>
<section class="panel" id="sweep-panel"><h2 id="sweep-title"></h2><p id="sweep-help"></p><div class="actions"><button id="sweep-refresh" disabled></button></div><p id="sweep-status" role="status" aria-live="polite"></p>
<label><span id="sweep-select-label"></span><select id="sweep-select"></select></label><pre id="sweep-details"></pre><button id="sweep-prepare" disabled></button>
<form id="sweep-sign-form"><label><span id="sweep-file-label"></span><input id="sweep-file" type="file" accept=".json,application/json" required></label><label><span id="sweep-password-label"></span><input name="password" type="password" autocomplete="off" required maxlength="128"></label><label><span id="sweep-sign-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="sweep-sign" class="primary" disabled></button></form>
<form id="sweep-broadcast-form"><label><span id="sweep-broadcast-confirm-label"></span><input name="confirmation" required pattern="TESTNET" autocomplete="off"></label><button id="sweep-broadcast" class="primary" disabled></button></form>
</section></main></body></html>
